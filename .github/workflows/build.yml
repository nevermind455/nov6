name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SNIPER_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ca-certificates \
            libssl-dev libboost1.83-dev libfmt-dev nlohmann-json3-dev \
            libnghttp2-dev libsecp256k1-dev \
            libgtest-dev libbenchmark-dev tmux curl jq

      - name: Build and run the native tests
        run: bash scripts/build.sh

      - name: Run setup on the shipped settings
        run: bash scripts/setup.sh

      # Offline, with the self-test's dummy key: no network and no wallet.
      - name: Check the first-run live settings
        shell: bash
        run: |
          bash -n scripts/run-live.sh
          bash -n scripts/live-preflight.sh
          bash tests/live_scripts_tests.sh
          bash scripts/prepare-live.sh
          [ "$(stat -c %a .env.live)" = 600 ]
          export SNIPER_LIVE_CANARY=1 POLY_PRIVATE_KEY="0x$(printf '%064d' 1)"
          ./bin/sniper-cpp --config .env.live --live --check
          ./bin/sniper-cpp --config .env.live --live --dry-run --check | jq -e '.mode == "LIVE DRY RUN"'
          # the baseline limit is accepted, anything else is refused
          sed 's/^SNIPER_SLIP=.*/SNIPER_SLIP=0.05/' .env.live > "$RUNNER_TEMP/slip05"
          chmod 600 "$RUNNER_TEMP/slip05"
          ./bin/sniper-cpp --config "$RUNNER_TEMP/slip05" --live --check
          sed 's/^SNIPER_SLIP=.*/SNIPER_SLIP=0.03/' .env.live > "$RUNNER_TEMP/slip03"
          chmod 600 "$RUNNER_TEMP/slip03"
          if ./bin/sniper-cpp --config "$RUNNER_TEMP/slip03" --live --check; then
            echo "a limit of ask + 0.03 was accepted for live"
            exit 1
          fi

      # Exercises the real sockets, TLS, HTTP/2, round changes and paper fills.
      # Everything stays on this machine: the fake venue stands in for every
      # outside service, so no real market is contacted.
      - name: Paper run against the local fake venue
        shell: bash
        working-directory: tools/fake-venue
        run: |
          bash make-certs.sh
          npm ci --ignore-scripts --no-audit --no-fund
          node --test oracle.test.js
          node venue.js > "$RUNNER_TEMP/venue.log" 2>&1 &
          venue=$!
          trap 'kill "$venue"' EXIT
          for _ in {1..30}; do
            (exec 3<>/dev/tcp/127.0.0.1/18080) 2>/dev/null && break
            sleep 1
          done

          HTTPS_PROXY=http://127.0.0.1:18080 SSL_CERT_FILE="$PWD/certs/ca.crt" \
            ../../bin/sniper-net-probe --label local-fixture --samples 3 \
              --interval-ms 0 --timeout-s 5 > "$RUNNER_TEMP/net-probe.json"
          jq -e '.success and .samples_completed == 3 and .order_capable_calls == 0 and .connection.tcp_no_delay and .connection.tcp_keep_alive' \
            "$RUNNER_TEMP/net-probe.json"

          sim="$RUNNER_TEMP/sim"
          mkdir -p "$sim"
          cp ../../.env.example "$sim/.env"
          chmod 600 "$sim/.env"

          # 360 seconds always crosses a 5-minute round boundary.
          HTTPS_PROXY=http://127.0.0.1:18080 SSL_CERT_FILE="$PWD/certs/ca.crt" \
            ../../bin/sniper-cpp --config "$sim/.env" --paper --run-for 360 \
            | tee "$sim/out.log"

          tail -n 1 "$sim/out.log" \
            | jq -e '.stopped and .exit_code == 0 and .errors == 0 and .signals > 0'
          grep '"result":"summary"' "$sim/out.log" | tail -n 1 \
            | jq -e '.coinbase_live and .clob_h2_ready'
          jq -s -e '[.[] | .round_end // empty] | unique | length >= 2' \
            "$sim/state/paper/sniper.jsonl"
          # the C++ health report reads the same state
          ../../bin/sniper-live-check --state "$sim/state/paper" | tee "$sim/live-check.txt"
          grep -qF "SIGNALS AND SKIPS" "$sim/live-check.txt"

      # The dashboard in a real terminal (tmux), against the same local venue.
      # The screen is saved so the layout can be read, at two sizes.
      - name: Dashboard run in a terminal
        shell: bash
        working-directory: tools/fake-venue
        run: |
          node venue.js > "$RUNNER_TEMP/venue-dash.log" 2>&1 &
          venue=$!
          trap 'kill "$venue"; tmux kill-server || true' EXIT
          for _ in {1..30}; do
            (exec 3<>/dev/tcp/127.0.0.1/18080) 2>/dev/null && break
            sleep 1
          done

          sim="$RUNNER_TEMP/dash"
          mkdir -p "$sim"
          cp ../../.env.example "$sim/.env"
          chmod 600 "$sim/.env"

          # This run also has the extra trigger feeds (Binance futures and spot).
          tmux new-session -d -s dash -x 170 -y 50 -c "$PWD" \
            "SNIPER_EXTRA_FEEDS=binance_fut,binance_spot HTTPS_PROXY=http://127.0.0.1:18080 SSL_CERT_FILE='$PWD/certs/ca.crt' ../../bin/sniper-cpp --config '$sim/.env' --paper --dash --run-for 270; echo \$? > '$sim/exit_code'; sleep 20"
          # Long enough for volatility to warm up and for orders to reach the table.
          sleep 240
          tmux capture-pane -pt dash > "$sim/frame-170x50.txt"
          tmux resize-window -t dash -x 100 -y 30
          sleep 3
          tmux capture-pane -pt dash > "$sim/frame-100x30.txt"
          for _ in {1..60}; do
            [ -f "$sim/exit_code" ] && break
            sleep 1
          done
          tmux capture-pane -pt dash -S -40 > "$sim/after-exit.txt"

          cat "$sim/frame-170x50.txt"
          cat "$sim/frame-100x30.txt"
          [ "$(cat "$sim/exit_code")" = 0 ]
          for part in "BTC SNIPER" TRIGGER MARKET ACCOUNT ORDERS HEALTH SETTLEMENT EVENTS "FAK +0.02" \
              "BIN FUT   LIVE" "BIN SPOT  LIVE" "fired"; do
            grep -qF "$part" "$sim/frame-170x50.txt"
          done
          for part in "BTC SNIPER" TRIGGER MARKET ACCOUNT ORDERS; do
            grep -qF "$part" "$sim/frame-100x30.txt"
          done
          # Shrinking the window must leave the last row drawn: a panel's bottom border.
          sed -n 30p "$sim/frame-100x30.txt" | grep -q $'\xe2\x94\x94'
          # The dashboard gave the screen back and the final report is on it.
          grep -qF '"stopped":true' "$sim/after-exit.txt"
          if grep -qF "BTC SNIPER" "$sim/after-exit.txt"; then
            echo "the dashboard was still on screen after the bot stopped"
            exit 1
          fi

      - name: Keep the paper run logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: paper-run-logs
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ runner.temp }}/venue.log
            ${{ runner.temp }}/net-probe.json
            ${{ runner.temp }}/sim/out.log
            ${{ runner.temp }}/sim/state/paper/*.jsonl
            ${{ runner.temp }}/dash/*.txt

      - name: Keep the rebuilt programs
        uses: actions/upload-artifact@v7
        with:
          name: sniper-linux-x86_64
          retention-days: 30
          path: bin/
